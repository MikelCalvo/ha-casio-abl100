              "content": "# Casio ABL-100\n{% if is_state('binary_sensor.renamed_15', 'on') and state_attr('binary_sensor.renamed_15', 'phase') in ['reading', 'applying'] %}\n**Leyendo el reloj o enviando cambios…**\n{% elif is_state('binary_sensor.renamed_15', 'on') %}\n**Conectado** · El reloj está disponible.\n{% else %}\n**Sin conexión** · Conecta el reloj desde CNCT.\n{% endif %}\n{% if state_attr('button.renamed_23', 'needs_reconciliation') %}\n\n⚠️ Hay un envío sin confirmar. Lee el reloj antes de volver a enviar.\n{% elif state_attr('button.renamed_23', 'draft_conflicted') %}\n\n⚠️ El reloj cambió desde que editaste. Revisa el borrador antes de enviar.\n{% elif state_attr('button.renamed_23', 'draft_pending') and state_attr('button.renamed_23', 'draft_saved') %}\n\n**Cambios pendientes** · Guardado en Home Assistant, sin enviar.\n{% elif state_attr('button.renamed_23', 'draft_pending') %}\n\n**Cambios pendientes** · Todavía no se han enviado al reloj.\n{% elif state_attr('button.renamed_23', 'apply_result') == 'verified' %}\n\n✓ Último envío comprobado en el reloj.\n{% endif %}"
