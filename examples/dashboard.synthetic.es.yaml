        {
          "type": "markdown",
          "content": "## Reloj: observaciones y acciones explícitas\nEste panel no conecta ni escribe al abrirse. Conectar puede estar limitado por los temporizadores del modo instalado; Actualizar usa la conexión y Cerrar solicita su cierre. El modo de retención larga es un candidato de producto separado: no se supone instalado ni aceptado. Elija el modo automático en las opciones de la integración solo si lo desea y después de instalar una versión probada; este panel no lo activa."
        },
