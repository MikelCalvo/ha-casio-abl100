        {
          "type": "markdown",
          "content": "### Editor por etapas\nCambiar un borrador NO toca el reloj. Aplicar envía cambios explícitos y verifica por lectura. Descartar solo borra el borrador, no deshace escrituras. La barrera duradera ante escritura incierta puede exigir una lectura de reconciliación: revise needs_reconciliation, write_submitted y apply_result antes de reintentar. La activación de alarmas y SIG sigue sin verificación física."
        },
